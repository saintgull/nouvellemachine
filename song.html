<style>
  :root{
    --pearl-aqua:#7cdedc;--medium-blue:#0700cc;--cotton-rose:#ffcfd2;
    --light-coral:#ea8885;--magenta-bloom:#e0486b;--ink:#14142e;--paper:#fffdfa;
    --light-blue:#9bb8ef;--serif:'Instrument Serif',Georgia,serif;--sans:'Work Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;font-weight:300;overflow-x:hidden}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}
  @media(max-width:640px){.wrap{padding:0 16px}}
  a{color:var(--medium-blue);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
  a:hover{color:var(--magenta-bloom)}
  .topnav{border-bottom:1px solid var(--cotton-rose)}
  .topnav .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:16px;padding-bottom:16px}
  .topnav .brand{font-family:var(--serif);font-size:1.15rem;color:var(--medium-blue);text-decoration:none}
  .topnav .navlinks a{font-size:.9rem;margin-left:18px;color:var(--ink);text-decoration:none;letter-spacing:.02em}
  .topnav .navlinks a:hover{color:var(--magenta-bloom)}
  .hero{padding:56px 0 10px}
  .kicker{font-size:.85rem;letter-spacing:.22em;text-transform:uppercase;color:var(--magenta-bloom);font-weight:500;margin-bottom:14px}
  h1{font-family:var(--serif);font-weight:400;line-height:1.06;font-size:clamp(2rem,5.4vw,3rem);color:var(--medium-blue)}
  .dek{font-family:var(--serif);font-style:italic;color:var(--light-coral);font-size:1.2rem;margin-top:14px;line-height:1.4}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
  .pills a{font-size:.85rem;font-weight:500;letter-spacing:.08em;text-decoration:none;padding:6px 12px;border:1px solid var(--light-blue);background:#fff}
  .pills a:hover{border-color:var(--magenta-bloom);color:var(--magenta-bloom)}
  .version{padding:48px 0 8px;border-bottom:1px solid var(--cotton-rose);scroll-margin-top:12px}
  .version:last-of-type{border-bottom:0}
  .version .lang{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta-bloom);font-weight:500}
  .version h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,4vw,2.1rem);color:var(--medium-blue);line-height:1.15;margin:4px 0 16px}
  .video{position:relative;aspect-ratio:16/9;background:var(--ink);overflow:hidden;border:1px solid var(--light-blue)}
  .video img,.video iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;display:block}
  .video.ready{cursor:pointer}
  .video .play{position:absolute;left:50%;top:50%;width:76px;height:54px;margin:-27px 0 0 -38px;background:var(--magenta-bloom);border:0;border-radius:12px;cursor:pointer;opacity:.92;transition:opacity .15s,transform .15s}
  .video .play::after{content:"";position:absolute;left:31px;top:16px;border-style:solid;border-width:11px 0 11px 19px;border-color:transparent transparent transparent #fff}
  .video.ready:hover .play{opacity:1;transform:scale(1.05)}
  .video .soon{position:absolute;left:12px;bottom:12px;background:var(--paper);color:var(--ink);font-size:.8rem;font-weight:500;padding:4px 10px}
  .desc{margin-top:18px}
  .desc p{margin-bottom:10px}
  .orgs{list-style:none;margin:6px 0 14px}
  .orgs li{padding:8px 0 8px 14px;border-left:2px solid var(--cotton-rose);margin-bottom:6px}
  .orgs li a{font-weight:500}
  .note{font-size:.88rem;opacity:.7}
  details{margin-top:8px;border-top:1px solid var(--cotton-rose);padding-top:8px}
  summary{cursor:pointer;font-weight:500;color:var(--medium-blue);font-size:.8rem;letter-spacing:.12em}
  .srcs{list-style:none;margin:10px 0 6px;font-size:.88rem}
  .srcs li{margin-bottom:10px;overflow-wrap:anywhere}
  .srcs .lyric{display:block}
  .ai{margin:10px 0 6px;font-size:.92rem}
  footer{padding:44px 0;text-align:center;border-top:1px solid var(--cotton-rose);font-size:.9rem;margin-top:40px}
  footer .socials{display:flex;gap:20px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  footer .copyright{display:block;margin-top:22px;font-size:.82rem;color:var(--ink);opacity:.5}
  .soonpage{min-height:55vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .soonpage h1{font-size:clamp(2.4rem,7vw,4rem)}
</style>

</div></footer>
